# ══════════════════════════════════════════════════════════════
# Docker Compose — PROD environment
#
# Usage:
#   docker compose -f docker-compose.prod.yaml up -d
#
# Required environment variables (set in .env or CI secrets):
#   SPRING_DATASOURCE_URL       jdbc:postgresql://postgres:5432/netline_reader
#   SPRING_DATASOURCE_USERNAME  netline
#   SPRING_DATASOURCE_PASSWORD  <secure>
#   ORACLE_DATASOURCE_URL       jdbc:oracle:thin:@//<host>:<port>/<service>
#   ORACLE_DATASOURCE_USERNAME  netline_read
#   ORACLE_DATASOURCE_PASSWORD  <secure>
#   KEYCLOAK_ISSUER_URI         https://keycloak.example.com/realms/netline-reader
#   KEYCLOAK_JWK_SET_URI        https://keycloak.example.com/realms/netline-reader/...
#   KEYCLOAK_ADMIN_URL          https://keycloak.example.com
#   KEYCLOAK_REALM              netline-reader
#   KEYCLOAK_ADMIN_USERNAME     admin
#   KEYCLOAK_ADMIN_PASSWORD     <secure>
#   CORS_ALLOWED_ORIGINS        https://gantt.example.com
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL (primary — users, saved filters) ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: netline_postgres_prod
    environment:
      POSTGRES_DB:       netline_reader
      POSTGRES_USER:     ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d netline_reader"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Spring Boot backend ───────────────────────────────────────
  backend:
    image: netline-reader-backend:latest
    container_name: netline_backend_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:    prod
      SPRING_DATASOURCE_URL:     jdbc:postgresql://postgres:5432/netline_reader
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      ORACLE_DATASOURCE_URL:     ${ORACLE_DATASOURCE_URL}
      ORACLE_DATASOURCE_USERNAME: ${ORACLE_DATASOURCE_USERNAME}
      ORACLE_DATASOURCE_PASSWORD: ${ORACLE_DATASOURCE_PASSWORD}
      KEYCLOAK_ISSUER_URI:       ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI:      ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_ADMIN_URL:        ${KEYCLOAK_ADMIN_URL}
      KEYCLOAK_REALM:            ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_USERNAME:   ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD:   ${KEYCLOAK_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS:      ${CORS_ALLOWED_ORIGINS}
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  postgres_prod_data:
