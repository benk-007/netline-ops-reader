# ══════════════════════════════════════════════════════════════
# Profile: PROD
#
# Activated by: SPRING_PROFILES_ACTIVE=prod
#
# Key differences from dev:
#   - OracleDataSourceConfig is active (@Profile("prod"))
#   - LegDataProvider is OracleLegDataProvider
#   - FakeMvRefreshJob is NOT instantiated
#   - Hibernate DDL auto=none for Oracle (read-only MVs)
#   - SQL logging disabled for performance
# ══════════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  datasource:
    # ── PostgreSQL (primary — required, no defaults) ──────────
    postgres:
      jdbc-url:          ${SPRING_DATASOURCE_URL}
      username:          ${SPRING_DATASOURCE_USERNAME}
      password:          ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver

    # ── Oracle (secondary — required in prod, no defaults) ────
    oracle:
      jdbc-url:          ${ORACLE_DATASOURCE_URL}
      username:          ${ORACLE_DATASOURCE_USERNAME}
      password:          ${ORACLE_DATASOURCE_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver

logging:
  level:
    com.ram.netline_reader_backend: INFO
    org.hibernate.SQL: WARN
