# ══════════════════════════════════════════════════════════════
# Profile: DEV
#
# Activated by: SPRING_PROFILES_ACTIVE=dev (default)
#
# Key differences from prod:
#   - Oracle is NOT used — LegDataProvider is FakeLegDataProvider
#   - leg_mv PostgreSQL table simulates the Oracle Materialized View
#   - FakeMvRefreshJob seeds realistic RAM flight data on startup
#     and refreshes every 3 minutes (configurable via fake-mv.refresh-cron)
#   - SSE events broadcast MV changes to connected frontend clients
#   - Hibernate DDL auto=update → leg_mv / leg_mv_delay tables auto-created
#   - Rich structured logging enabled for all relevant layers
# ══════════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: false   # use provider-level DEBUG logs instead of raw SQL noise
    properties:
      hibernate:
        hbm2ddl:
          auto: update   # auto-creates/updates leg_mv and leg_mv_delay tables

app:
  # ── Fake MV refresh schedule ─────────────────────────────────
  # Standard cron: every 3 minutes.
  # Set to "-" to freeze data while debugging (disables scheduling).
  fake-mv:
    refresh-cron: "0 */3 * * * *"

  # ── PostgreSQL (primary + fake MV) ──────────────────────────
  datasource:
    postgres:
      jdbc-url:          ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netline_reader}
      username:          ${SPRING_DATASOURCE_USERNAME:netline}
      password:          ${SPRING_DATASOURCE_PASSWORD:netline_secret}
      driver-class-name: org.postgresql.Driver

# ══════════════════════════════════════════════════════════════
# Logging — dev profile
#
# Layer                           Level    What you see
# ──────────────────────────────  ──────   ──────────────────────────────────────────
# FakeMvRefreshJob                DEBUG    seed counts, state transitions, delay adds
# FakeLegDataProvider             DEBUG    every query + result count
# LegServiceImpl                  DEBUG    cache hits/misses, station-scope filtering
# MvRefreshSseService             DEBUG    SSE connect/disconnect/broadcast
# Spring Cache                    DEBUG    @Cacheable / @CacheEvict decisions
# Spring Security (auth)          INFO     token validation, access denied
# Hibernate SQL                   WARN     suppressed — use provider logs instead
# ══════════════════════════════════════════════════════════════
logging:
  level:
    # ── Application layers ──────────────────────────────────
    com.ram.netline_reader_backend.provider.fake: DEBUG   # FakeMvRefreshJob + FakeLegDataProvider
    com.ram.netline_reader_backend.provider:      DEBUG   # OracleLegDataProvider (unused in dev but harmless)
    com.ram.netline_reader_backend.service:       DEBUG   # LegServiceImpl, MvRefreshSseService, UserService
    com.ram.netline_reader_backend.controller:    INFO    # request entry points — keep concise
    com.ram.netline_reader_backend.config:        INFO    # datasource / security wiring

    # ── Spring Cache ─────────────────────────────────────────
    org.springframework.cache:                    DEBUG   # shows cache hits, misses, evictions

    # ── Spring Security ──────────────────────────────────────
    org.springframework.security:                 INFO    # JWT validation, 401/403 decisions

    # ── Hibernate / JDBC — suppressed ────────────────────────
    org.hibernate.SQL:                            WARN    # raw SQL off — use provider DEBUG logs
    org.hibernate.type.descriptor.sql:            WARN
    com.zaxxer.hikari:                            WARN    # connection pool noise suppressed
