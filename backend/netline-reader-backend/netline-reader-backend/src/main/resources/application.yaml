# ══════════════════════════════════════════════════════════════
# Netline Reader Backend — Application Configuration
#
# ┌─────────────────────────────────────────────────────────────┐
# │  MULTI-DATABASE ARCHITECTURE                                │
# │                                                              │
# │  1. PostgreSQL (primary) — users, saved filters (read/write)│
# │  2. Oracle (secondary)   — leg materialized views (read-only)│
# │                                                              │
# │  Both datasources are configured manually in the config/    │
# │  package (PostgresDataSourceConfig + OracleDataSourceConfig) │
# │  because Spring Boot's auto-config only supports one DB.    │
# └─────────────────────────────────────────────────────────────┘
#
# Environment variables (set in docker-compose.yml or IDE run config):
#
#   SPRING_DATASOURCE_URL       — PostgreSQL JDBC connection string
#   SPRING_DATASOURCE_USERNAME  — PostgreSQL username
#   SPRING_DATASOURCE_PASSWORD  — PostgreSQL password
#   ORACLE_DATASOURCE_URL       — Oracle JDBC connection string
#   ORACLE_DATASOURCE_USERNAME  — Oracle read-only username
#   ORACLE_DATASOURCE_PASSWORD  — Oracle read-only password
#   KEYCLOAK_ISSUER_URI         — Keycloak realm public URL
#   KEYCLOAK_JWK_SET_URI        — Keycloak JWKS endpoint
#   CORS_ALLOWED_ORIGINS        — comma-separated browser origins
# ══════════════════════════════════════════════════════════════

spring:

  # ── JPA global settings ──────────────────────────────────────
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── OAuth2 Resource Server — Keycloak JWT validation ───────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/netline-reader}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/netline-reader/protocol/openid-connect/certs}

server:
  port: 8080

# ── Actuator + Prometheus metrics ───────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# ── Application-level settings ────────────────────────────────
app:

  # ── PostgreSQL connection (primary — read/write) ─────────────
  datasource:
    postgres:
      jdbc-url:          ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/netline_reader}
      username:          ${SPRING_DATASOURCE_USERNAME:netline}
      password:          ${SPRING_DATASOURCE_PASSWORD:netline_secret}
      driver-class-name: org.postgresql.Driver

    # ── Oracle connection (secondary — read-only) ──────────────
    # Points to the Oracle DB hosting Netline OPS materialized views.
    oracle:
      jdbc-url:          ${ORACLE_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/NETLINEDB}
      username:          ${ORACLE_DATASOURCE_USERNAME:netline_read}
      password:          ${ORACLE_DATASOURCE_PASSWORD:netline_read_secret}
      driver-class-name: oracle.jdbc.OracleDriver

  # ── Oracle toggle ─────────────────────────────────────────────
  # Set to true when a real Oracle database is available.
  # When false (default), the Oracle datasource is not created
  # and a mock LegService returns empty results.
  oracle:
    enabled: ${ORACLE_ENABLED:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # ── Keycloak Admin API ─────────────────────────────────────
  keycloak:
    server-url:    ${KEYCLOAK_ADMIN_URL:http://localhost:9090}
    realm:         ${KEYCLOAK_REALM:netline-reader}
    client-id:     ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
