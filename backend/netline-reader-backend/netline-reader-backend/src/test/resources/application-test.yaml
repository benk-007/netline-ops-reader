app:
  oracle:
    enabled: false
  datasource:
    postgres:
      jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
  keycloak:
    server-url: http://localhost:9090
    realm: netline-reader
    client-id: admin-cli
    admin-username: admin
    admin-password: admin

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/netline-reader
          jwk-set-uri: http://localhost:9090/realms/netline-reader/protocol/openid-connect/certs
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
