# ══════════════════════════════════════════════════════════════
# Netline Reader — Full Stack Docker Compose
# ══════════════════════════════════════════════════════════════
# Services:
#   postgres   — PostgreSQL 16 database
#   keycloak   — Keycloak 24 identity provider  (SSO + JWT)
#   backend    — Spring Boot REST API            (port 8080)
#   frontend   — React SPA via Nginx             (port 3000)
#
# Usage:
#   docker compose up --build
#
# Default credentials:
#   Keycloak admin console : http://localhost:9090  (admin / admin)
#   App users              : admin/admin123  ops/ops123  chef/chef123  aol/aol123
#
# ── JWT Issuer URL Note ────────────────────────────────────────
# The browser connects to Keycloak at localhost:9090, so every JWT
# carries  iss=http://localhost:9090/realms/netline-reader.
#
# KEYCLOAK_ISSUER_URI (backend) must match that iss claim → localhost:9090.
# KEYCLOAK_JWK_SET_URI uses the internal Docker hostname keycloak:9090
# because the backend container cannot reach localhost:9090 (that would
# be itself, not Keycloak).
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       netline_reader
      POSTGRES_USER:     netline
      POSTGRES_PASSWORD: netline_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U netline -d netline_reader"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ── Keycloak Identity Provider ─────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT:            9090
    ports:
      - "9090:9090"
    volumes:
      - ./keycloak/netline-realm.json:/opt/keycloak/data/import/netline-realm.json:ro
    healthcheck:
      # Keycloak 24 dev mode does not expose /health/ready on the main HTTP port.
      # We probe the imported realm endpoint instead — it returns 200 once fully ready.
      # curl/wget are absent in the Keycloak UBI image so we use bash /dev/tcp.
      # Note: use array form ["CMD-SHELL", "cmd"] — the string/block-scalar form
      #       prepends a duplicate "CMD-SHELL" causing Docker to run it as a shell
      #       command (which fails).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9090 && echo -e 'GET /realms/netline-reader HTTP/1.1\\r\\nHost: localhost:9090\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval:     10s
      timeout:      5s
      retries:      15
      start_period: 40s

  # ── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context:    ./backend/netline-reader-backend/netline-reader-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Activate dev profile → FakeLegDataProvider (PostgreSQL MV), no Oracle needed
      SPRING_PROFILES_ACTIVE: dev

      # ── Database ──
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/netline_reader
      SPRING_DATASOURCE_USERNAME: netline
      SPRING_DATASOURCE_PASSWORD: netline_secret

      # ── Keycloak JWT validation ──
      # KEYCLOAK_ISSUER_URI must match the "iss" claim in the JWT, which is the
      # URL the *browser* used to get the token → localhost:9090 (the exposed port).
      KEYCLOAK_ISSUER_URI:  http://localhost:9090/realms/netline-reader

      # KEYCLOAK_JWK_SET_URI is used by the backend container to fetch Keycloak's
      # public keys. It uses the Docker-internal hostname, not localhost.
      KEYCLOAK_JWK_SET_URI: http://keycloak:9090/realms/netline-reader/protocol/openid-connect/certs

      # ── Keycloak Admin API (user create / update / delete sync) ──
      KEYCLOAK_ADMIN_URL:       http://keycloak:9090
      KEYCLOAK_REALM:           netline-reader
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME:  admin
      KEYCLOAK_ADMIN_PASSWORD:  admin

      # ── CORS ──
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ── React Frontend (Nginx) ─────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Prometheus (metrics collection) ──────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9091:9091"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=:9091"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  # ── Grafana (metrics dashboards) ─────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
