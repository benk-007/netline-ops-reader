# ══════════════════════════════════════════════════════════════
# Netline Reader — Full Stack Docker Compose
# ══════════════════════════════════════════════════════════════
# Services:
#   - postgres   : PostgreSQL 16 database
#   - keycloak   : Keycloak 24 identity provider (SSO + JWT)
#   - backend    : Spring Boot API (port 8080)
#   - frontend   : React SPA via Nginx (port 3000)
#
# Usage:
#   docker compose up --build
#
# Default credentials:
#   Keycloak admin console: http://localhost:9090  (admin / admin)
#   App users: admin/admin123, ops/ops123, chef/chef123
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netline_reader
      POSTGRES_USER: netline
      POSTGRES_PASSWORD: netline_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netline -d netline_reader"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Keycloak Identity Provider ──
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9090
    ports:
      - "9090:9090"
    volumes:
      - ./keycloak/netline-realm.json:/opt/keycloak/data/import/netline-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9090 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Spring Boot Backend ──
  backend:
    build:
      context: ./backend/netline-reader-backend/netline-reader-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/netline_reader
      SPRING_DATASOURCE_USERNAME: netline
      SPRING_DATASOURCE_PASSWORD: netline_secret
      KEYCLOAK_ISSUER_URI: http://keycloak:9090/realms/netline-reader
      KEYCLOAK_JWK_SET_URI: http://keycloak:9090/realms/netline-reader/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ── React Frontend (Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
