<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red circle background -->
  <circle cx="50" cy="50" r="50" fill="#D71920"/>

  <!-- Stylised Royal Air Maroc bird / star motif in white -->
  <!-- Central body -->
  <ellipse cx="50" cy="54" rx="7" ry="16" fill="white"/>

  <!-- Left wing sweep -->
  <path d="M43 52 C34 44,18 46,14 54 C20 52,34 54,43 56 Z" fill="white"/>
  <!-- Right wing sweep -->
  <path d="M57 52 C66 44,82 46,86 54 C80 52,66 54,57 56 Z" fill="white"/>

  <!-- Head -->
  <circle cx="50" cy="36" r="8" fill="white"/>
  <!-- Beak (slight leftward hook) -->
  <path d="M44 34 L38 31 L43 37 Z" fill="#D71920"/>

  <!-- Tail feathers -->
  <path d="M44 68 L50 80 L56 68 Z" fill="white"/>
  <path d="M40 66 L38 78 L46 70 Z" fill="white" opacity="0.7"/>
  <path d="M60 66 L62 78 L54 70 Z" fill="white" opacity="0.7"/>
</svg>
